[package]
name = "lmv"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "lmv"
path = "src/main.rs"
required-features = ["bin"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"], optional = true }
ffmpeg-next.workspace = true
iced = { workspace = true, optional = true }
lmv-engine.workspace = true
lmv-iced = { path = "../lmv-iced", optional = true }
pipewire.workspace = true
time = { version = "0.3.47", features = ["macros"], optional = true }
tokio = { version = "1.52.3", features = ["sync", "time"], optional = true }
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = [
  "env-filter",
  "local-time",
  "time",
], optional = true }

[features]
bin = [
  "dep:clap",
  "dep:iced",
  "dep:lmv-iced",
  "dep:time",
  "dep:tokio",
  "dep:tracing-subscriber",
]
