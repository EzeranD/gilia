[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/EzeranD/gilia"
authors = ["Ezeran Duchesne"]

[workspace.dependencies]
ffmpeg-next = "8.1.0"
tracing = "0.1.44"
ash = "0.38"
bytemuck = { version = "1.25.0", features = ["derive"] }
iced = { version = "0.15.0-dev", default-features = false, features = [
  "tokio",
  "wgpu",
  "wayland",
  "advanced",
  "web-colors",
  "fira-sans",
  "hinting",
] }
libass = { git = "https://github.com/EzeranD/libass-rs" }
gilia-engine = { version = "0.1.0", path = "crates/gilia-engine" }
snafu = "0.9.2"

[patch.crates-io]
iced = { git = "https://github.com/EzeranD/iced", branch = "master" }
iced_core = { git = "https://github.com/EzeranD/iced", branch = "master" }
iced_runtime = { git = "https://github.com/EzeranD/iced", branch = "master" }
iced_program = { git = "https://github.com/EzeranD/iced", branch = "master" }
iced_futures = { git = "https://github.com/EzeranD/iced", branch = "master" }
iced_widget = { git = "https://github.com/EzeranD/iced", branch = "master" }
iced_graphics = { git = "https://github.com/EzeranD/iced", branch = "master" }
iced_wgpu = { git = "https://github.com/EzeranD/iced", branch = "master" }
iced_renderer = { git = "https://github.com/EzeranD/iced", branch = "master" }
